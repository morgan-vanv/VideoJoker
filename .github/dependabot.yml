# Dependabot version updates: a few grouped PRs a month to keep dependencies fresh.
# Security fixes are separate and still arrive right away (repo setting "Dependabot security updates").
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # Python packages in requirements.txt and requirements-dev.txt
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      python-packages:
        patterns: ["*"]

  # Actions used in .github/workflows (e.g. actions/setup-python)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]

  # The Python base image in the Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
