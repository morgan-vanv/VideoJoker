# Dependabot version updates: a few grouped PRs a month to keep dependencies fresh.
# Security fixes are separate and still arrive right away (repo setting "Dependabot security updates").
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # Python packages in requirements.txt and requirements-dev.txt
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      python-packages:
        patterns: ["*"]
    ignore:
      # discord.py 2.7.1 (the latest) requires PyNaCl<1.6, so 1.6+ can't install yet.
      # Remove this once a discord.py release allows PyNaCl 1.6.
      - dependency-name: "pynacl"
        versions: [">=1.6"]

  # Actions used in .github/workflows (e.g. actions/setup-python)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]

  # The Python base image in the Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # Patch updates (3.14.10 -> 3.14.11) still come through. A new minor Python (3.15) is moved to
      # on purpose, together with .python-version (which CI and local tools use), not by the Dockerfile alone.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
